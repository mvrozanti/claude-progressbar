name: test

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Record the result for the badges
        if: always()
        shell: bash
        run: |
          mkdir -p result
          printf '{"job": "unittest", "os": "%s", "python": "%s", "ok": %s}\n' \
            "${{ matrix.os }}" "${{ matrix.python }}" "${{ job.status == 'success' }}" \
            > "result/unittest-${{ matrix.os }}-${{ matrix.python }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-unittest-${{ matrix.os }}-${{ matrix.python }}
          path: result/
          retention-days: 7

  claude-code:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Claude Code
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Claude Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Claude Code version
        id: claude
        shell: bash
        run: |
          claude --version
          echo "version=$(claude --version | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Bars for the commands a real Claude Code runs, driven by a mock API
        env:
          CLAUDE_PROGRESSBAR_LIVE: "1"
        timeout-minutes: 10
        run: python -m unittest tests.test_live_claude -v
      - name: Record the result for the badges
        if: always()
        shell: bash
        run: |
          mkdir -p result
          printf '{"job": "claude-code", "os": "%s", "claude": "%s", "ok": %s}\n' \
            "${{ matrix.os }}" "${{ steps.claude.outputs.version }}" "${{ job.status == 'success' }}" \
            > "result/claude-code-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-claude-code-${{ matrix.os }}
          path: result/
          retention-days: 7

  badges:
    needs: [unittest, claude-code]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - run: python3 .github/badges.py results badges
      - name: Publish to the badges branch
        working-directory: badges
        env:
          TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- *.json
          git commit -q -m "badges from ${GITHUB_SHA::7}, run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" badges

  notify:
    needs: [unittest, claude-code]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Push a failure notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "$NTFY_TOPIC" ] || { echo "NTFY_TOPIC unset; no push notification"; exit 0; }
          curl -fsS -H "Title: claude-progressbar tests FAILED on ${{ github.ref_name }}" \
               -H "Priority: high" -H "Tags: rotating_light" \
               -d "${{ github.workflow }} failed for ${{ github.sha }} (${{ github.event_name }})
          unittest=${{ needs.unittest.result }} claude-code=${{ needs.claude-code.result }}
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
               "$NTFY_TOPIC"
      - name: Say what failed in the log either way
        run: |
          echo "unittest=${{ needs.unittest.result }} claude-code=${{ needs.claude-code.result }}"
          echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
